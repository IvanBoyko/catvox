name: Read environment config
description: Read CatVox xcconfig values needed before GCP authentication.

inputs:
  environment:
    description: CatVox environment name.
    required: true

outputs:
  gcp_project_id:
    description: GCP project ID for the selected CatVox environment.
    value: ${{ steps.read.outputs.gcp_project_id }}
  gcp_service_account:
    description: CI service account email for Workload Identity Federation.
    value: ${{ steps.read.outputs.gcp_service_account }}
  gcp_wif_provider:
    description: Workload Identity Federation provider resource name.
    value: ${{ steps.read.outputs.gcp_wif_provider }}

runs:
  using: composite
  steps:
    - name: Read xcconfig
      id: read
      shell: bash
      env:
        CATVOX_ACTION_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        if [[ -z "$CATVOX_ACTION_ENVIRONMENT" ]]; then
          echo "environment input is required." >&2
          exit 1
        fi

        config="config/environments/${CATVOX_ACTION_ENVIRONMENT}.xcconfig"

        # One parse for the whole xcconfig, then source the resulting fragment
        # so every key becomes a shell variable. The emitter validates the
        # _HOST/_HOST_NAME scheme rule for every key in the file before
        # writing any output, so a malformed value aborts the action loudly
        # rather than producing a partial sourceable fragment.
        fragment="$(mktemp)"
        trap 'rm -f "$fragment"' EXIT
        scripts/lib/emit-xcconfig-env.sh --format=sh "$config" > "$fragment"
        # shellcheck source=/dev/null
        . "$fragment"

        : "${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set in $config}"
        : "${CATVOX_GCP_CI_SERVICE_ACCOUNT:?CATVOX_GCP_CI_SERVICE_ACCOUNT must be set in $config}"
        : "${CATVOX_GCP_WIF_PROVIDER:?CATVOX_GCP_WIF_PROVIDER must be set in $config}"

        {
          printf 'gcp_project_id=%s\n' "$GCP_PROJECT_ID"
          printf 'gcp_service_account=%s\n' "$CATVOX_GCP_CI_SERVICE_ACCOUNT"
          printf 'gcp_wif_provider=%s\n' "$CATVOX_GCP_WIF_PROVIDER"
        } >> "$GITHUB_OUTPUT"

        {
          printf 'GCP_PROJECT_ID=%s\n' "$GCP_PROJECT_ID"
          printf 'CATVOX_GCP_CI_SERVICE_ACCOUNT=%s\n' "$CATVOX_GCP_CI_SERVICE_ACCOUNT"
          printf 'CATVOX_GCP_WIF_PROVIDER=%s\n' "$CATVOX_GCP_WIF_PROVIDER"
        } >> "$GITHUB_ENV"
