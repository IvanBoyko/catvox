name: Functions Deploy (reusable)

# Reusable Firebase Functions deploy for one environment. Called by
# functions.yml: automatically for dev on merge to main, and manually for prod
# via workflow_dispatch. The environment protection (required reviewers) and WIF
# ref pin are enforced by the GitHub Environment named here. No integration tests
# run here — protected environments use the non-invasive smoke path instead.

on:
  workflow_call:
    inputs:
      environment:
        description: CatVox environment to deploy Functions to.
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation token exchange

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CATVOX_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ inputs.environment }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: make functions-install

      - name: Build and deploy to Firebase
        run: make functions-deploy
