name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'Makefile'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'Makefile'
      - '.github/workflows/terraform.yml'

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one. Separate group from the iOS build workflow.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_TERRAFORM_ENV: dev
  CATVOX_TF_STATE_PREFIX: catvox/state
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Passed to Terraform as TF_VAR_* values.
  # TF_VAR_* prefix is picked up automatically — no extra wiring needed.
  TF_VAR_environment_name: dev
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: us-central1
  TF_VAR_firestore_location: nam5
  TF_VAR_tf_state_bucket: ${{ format('catvox-tf-state-{0}', secrets.GCP_PROJECT_ID) }}
  TF_VAR_firebase_ios_bundle_id: com.kathelix.catvox.dev
  TF_VAR_firebase_ios_app_display_name: CatVox Dev iOS
  TF_VAR_firebase_apple_team_id: QYT76L5836
  TF_VAR_enable_app_check_debug_token: true
  TF_VAR_app_check_debug_token: ${{ secrets.TF_VAR_APP_CHECK_DEBUG_TOKEN }}
  TF_VAR_app_check_debug_token_display_name: CatVox Dev integration token
  TF_VAR_manage_gcf_sources_bucket_iam: true
  TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF, runs
  # terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make terraform-init

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          make terraform-ci-plan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps. Truncates plan output
      # if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const actor    = '${{ github.actor }}';

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (outcome === 'failure') {
              core.setFailed('Terraform plan failed — see PR comment for details.');
            }

  # ── Apply ────────────────────────────────────────────────────────────────────
  # Runs only when a commit lands on main (i.e. PR is merged). Re-authenticates
  # via WIF and applies the plan with -auto-approve.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make terraform-init

      - name: Terraform Apply
        run: make terraform-ci-apply
