name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '!terraform/posthog/**'
      - 'CatVox/Resources/Firebase/GoogleService-Info-*.plist'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - 'scripts/guard-terraform-tfvars-private-only.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '!terraform/posthog/**'
      - 'CatVox/Resources/Firebase/GoogleService-Info-*.plist'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - 'scripts/guard-terraform-tfvars-private-only.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/workflows/terraform.yml'

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one. Separate group from the iOS build workflow.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_ENVIRONMENT: dev
  CATVOX_TF_STATE_PREFIX: catvox/state

  # Remaining Terraform secrets. Non-secret GCP/Firebase values come from
  # config/environments/${CATVOX_ENVIRONMENT}.xcconfig via the Makefile.
  TF_VAR_app_check_debug_token: ${{ secrets.TF_VAR_APP_CHECK_DEBUG_TOKEN }}
  TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF, runs
  # terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read environment config
        id: env
        uses: ./.github/actions/read-environment-config
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.env.outputs.gcp_wif_provider }}
          service_account: ${{ steps.env.outputs.gcp_service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make terraform-init

      - name: Firebase plist drift check
        id: plist-drift
        run: make ios-validate-env-config-drift
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Test
        id: test
        run: make terraform-test

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          make terraform-ci-plan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps. Truncates plan output
      # if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const plist    = '${{ steps.plist-drift.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const test     = '${{ steps.test.outcome }}';
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const actor    = '${{ github.actor }}';

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '| Test    | `' + test + '` |',
              '| Plist drift | `' + plist + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (plist === 'failure') {
              core.setFailed('Firebase plist drift check failed — regenerate the plist from Terraform output.');
            } else if (outcome === 'failure') {
              core.setFailed('Terraform plan failed — see PR comment for details.');
            }

  # ── Apply ────────────────────────────────────────────────────────────────────
  # Runs only when a commit lands on main (i.e. PR is merged). Re-authenticates
  # via WIF and applies the plan with -auto-approve.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read environment config
        id: env
        uses: ./.github/actions/read-environment-config
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.env.outputs.gcp_wif_provider }}
          service_account: ${{ steps.env.outputs.gcp_service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make terraform-init

      - name: Terraform Apply
        run: make terraform-ci-apply
