name: Terraform

on:
  # Manual trigger = promote to prod. There is no environment chooser: dev is the
  # automatic path (push to main), prod is this manual step. See apply-prod below.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform/core/**'
      - 'CatVox/Resources/Firebase/GoogleService-Info-*.plist'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - 'scripts/guard-terraform-tfvars-private-only.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/actions/terraform-ci-plan/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-apply.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/core/**'
      - 'CatVox/Resources/Firebase/GoogleService-Info-*.plist'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - 'scripts/guard-terraform-tfvars-private-only.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/actions/terraform-ci-plan/**'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/terraform-apply.yml'

# Cancel any in-progress run for the same branch + event so a push doesn't queue
# behind the previous one. Keying on event_name isolates the manual prod promote
# (workflow_dispatch) from the automatic dev apply (push) on main.
concurrency:
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_ENVIRONMENT: dev
  CATVOX_TF_STATE_PREFIX: catvox/state

  # Remaining Terraform secrets. Non-secret GCP/Firebase values come from
  # config/environments/${CATVOX_ENVIRONMENT}.xcconfig via the Makefile.
  TF_VAR_app_check_debug_token: ${{ secrets.TF_VAR_APP_CHECK_DEBUG_TOKEN }}
  TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF, runs
  # terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make terraform-init

      - name: Firebase plist drift check
        id: plist-drift
        run: make ios-validate-env-config-drift
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Test
        id: test
        run: make terraform-test

      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/terraform-ci-plan
        with:
          make-target: terraform-ci-plan
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps — but only when there is
      # something to report. A clean run (plan exit code 0 = no changes, all
      # other checks green) skips the comment so it never emails reviewers. Plan
      # output is truncated if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const plist    = '${{ steps.plist-drift.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const test     = '${{ steps.test.outcome }}';
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const actor    = '${{ github.actor }}';

            // Skip the comment entirely on a clean no-change run (plan exit
            // code 0, fmt and plist green). Posting nothing means GitHub sends
            // no email — only real diffs (exit 2) and failures get a comment.
            if (exitcode === '0' && fmt !== 'failure' && plist !== 'failure') {
              core.info('Terraform plan: no changes and all checks passed — skipping PR comment.');
              return;
            }

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '| Test    | `' + test + '` |',
              '| Plist drift | `' + plist + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by ${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (plist === 'failure') {
              core.setFailed('Firebase plist drift check failed — regenerate the plist from Terraform output.');
            } else if (outcome === 'failure') {
              core.setFailed('Terraform plan failed — see PR comment for details.');
            }

  # ── Apply: dev (automatic) ───────────────────────────────────────────────────
  # Runs when a commit lands on main (i.e. PR merged). Applies to dev via the
  # reusable workflow.
  apply-dev:
    name: Apply (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: dev
    secrets: inherit

  # ── Apply: prod (manual promotion) ───────────────────────────────────────────
  # Runs only on a manual workflow_dispatch from main. The protected `prod`
  # GitHub Environment (required reviewers) gates the run, and its WIF trust
  # requires ref=refs/heads/main (ADR-0024). The first prod apply is
  # operator-local (it creates the WIF pool and catvox-ci-sa); this path covers
  # every subsequent prod apply.
  apply-prod:
    name: Apply (prod)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: prod
    secrets: inherit
