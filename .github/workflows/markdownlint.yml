name: Markdown

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.markdownlint.jsonc'
      - '.github/workflows/markdownlint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.markdownlint.jsonc'
      - '.github/workflows/markdownlint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: '.markdownlint.jsonc'
          globs: |
            README.md
            AGENTS.md
            CLAUDE.md
            docs/**/*.md
