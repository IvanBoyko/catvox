name: Repository scripts

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/lib/**'
      - 'scripts/test/**'
      - 'tools/ai-loop/**'
      - 'config/environments/**'
      # Docs read by scripts/test/docs-environment-model-sst.test.mjs — the
      # single-source-of-truth contract must re-run when these change.
      - 'docs/TRD.md'
      - 'docs/HLD.md'
      - 'docs/CREATE_NEW_ENVIRONMENT.md'
      - 'terraform/README.md'
      - '.github/workflows/scripts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/lib/**'
      - 'scripts/test/**'
      - 'tools/ai-loop/**'
      - 'config/environments/**'
      # Docs read by scripts/test/docs-environment-model-sst.test.mjs — the
      # single-source-of-truth contract must re-run when these change.
      - 'docs/TRD.md'
      - 'docs/HLD.md'
      - 'docs/CREATE_NEW_ENVIRONMENT.md'
      - 'terraform/README.md'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts-test:
    name: scripts-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository script tests
        run: make scripts-test
