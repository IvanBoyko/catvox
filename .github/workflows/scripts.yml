name: Repository scripts

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/lib/**'
      - 'scripts/test/**'
      - 'config/environments/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'scripts/lib/**'
      - 'scripts/test/**'
      - 'config/environments/**'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts-test:
    name: scripts-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository script tests
        run: make scripts-test
