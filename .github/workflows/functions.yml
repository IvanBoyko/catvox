name: Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'docs/systemInstruction.md'
      - 'Makefile'
      - '.github/workflows/functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'docs/systemInstruction.md'
      - 'Makefile'
      - '.github/workflows/functions.yml'

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation token exchange

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  # Runs on every push and PR. Catches TypeScript compile errors and unit-test
  # regressions early. Dev integration tests run only after main deploy.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: make functions-install

      - name: Build and unit tests
        run: make functions-test

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Runs only on merge to main. Authenticates via WIF and deploys to GCP.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: make functions-install

      - name: Build and deploy to Firebase
        env:
          FIREBASE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: make functions-deploy

  # ── Integration: post-deploy ─────────────────────────────────────────────────
  # Runs only after main deploy. Treats the current live GCP/Firebase project as
  # the Dev environment until a real production split exists.
  integration-after-deploy:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: make functions-install

      - name: Run integration tests
        env:
          CATVOX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CATVOX_APP_CHECK_DEBUG_TOKEN: ${{ secrets.TF_VAR_app_check_debug_token }}
        run: make functions-integration
