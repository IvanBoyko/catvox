name: Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'docs/systemInstruction.md'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/workflows/functions.yml'
      - '.github/workflows/functions-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'docs/systemInstruction.md'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/workflows/functions.yml'
      - '.github/workflows/functions-deploy.yml'

concurrency:
  # Keying on event_name keeps PR runs separate from the push pipeline on main.
  group: functions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation token exchange

env:
  CATVOX_ENVIRONMENT: dev

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  # Runs on every push, PR, and manual dispatch. Catches TypeScript compile errors
  # and unit-test regressions before any deploy. Dev integration tests run only
  # after the dev deploy.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: make functions-install

      - name: Build and unit tests
        run: make functions-test

  # ── Deploy: dev (automatic) ──────────────────────────────────────────────────
  # Runs on merge to main. Deploys to dev via the reusable workflow.
  deploy-dev:
    name: Deploy (dev)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/functions-deploy.yml
    with:
      environment: dev

  # ── Integration: post-dev-deploy ─────────────────────────────────────────────
  # Runs only after the dev deploy, against the integration-safe Dev environment.
  # Protected environments never run these mutable tests.
  integration-after-deploy:
    name: Integration Tests
    runs-on: ubuntu-latest
    environment: dev
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: make functions-install

      - name: Run integration tests
        env:
          # DEV ONLY — Prod smoke checks must not include prod in this mutable-test allowlist.
          CATVOX_INTEGRATION_SAFE_ENVIRONMENTS: dev
          CATVOX_APP_CHECK_DEBUG_TOKEN: ${{ secrets.TF_VAR_APP_CHECK_DEBUG_TOKEN }}
        run: make functions-integration

  # ── Deploy: prod (gated promotion) ───────────────────────────────────────────
  # Promotion is ordered: this runs only after the dev deploy AND dev integration
  # succeed on main (needs: integration-after-deploy). The protected `prod` GitHub
  # Environment then pauses it for required-reviewer approval — that approval is
  # the manual promote step. No integration runs against prod; use the
  # non-invasive `make smoke CATVOX_ENVIRONMENT=prod`. (Ordering prod relative to
  # the Terraform pipeline is tracked in #106.)
  deploy-prod:
    name: Deploy (prod)
    needs: integration-after-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/functions-deploy.yml
    with:
      environment: prod
