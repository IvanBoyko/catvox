name: Build

on:
  push:
    branches: [main]
    paths:
      - 'CatVox/**'
      - 'CatVoxTests/**'
      - 'CatVoxUITests/**'
      - 'CatVox.xcodeproj/**'
      - 'config/environments/**'
      - 'scripts/**'
      - 'Makefile'
      - 'project.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CatVox/**'
      - 'CatVoxTests/**'
      - 'CatVoxUITests/**'
      - 'CatVox.xcodeproj/**'
      - 'config/environments/**'
      - 'scripts/**'
      - 'Makefile'
      - 'project.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to least privilege. Both jobs only check
# out the repo and run the build/test toolchain — no write scopes required.
permissions:
  contents: read

jobs:
  build:
    name: Build — iOS Simulator
    runs-on: macos-15          # Ships with Xcode 16.x; iOS 17+ SDK included

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      # ── Project generation ───────────────────────────────────────────────
      # Regenerate from project.yml to catch any drift between the spec
      # and the committed .xcodeproj.
      - name: Generate Xcode project
        run: make ios-generate

      - name: Validate Firebase Environment Config
        run: |
          node --version
          make ios-validate-env-config

      - name: Validate Prod Environment Structure
        run: make ios-validate-env-config-structure CATVOX_ENVIRONMENT=prod

      - name: Validate Prod Firebase Config
        run: make ios-validate-env-config CATVOX_ENVIRONMENT=prod

      - name: Validate Release Safety (protected environment)
        run: make ios-validate-release-safety CATVOX_ENVIRONMENT=prod

      - name: Guard Analytics Capture Boundary
        run: make ios-analytics-guard

      # ── Build ────────────────────────────────────────────────────────────
      # Targets the generic simulator slice — no device signing required.
      - name: Build for iOS Simulator
        timeout-minutes: 15
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-build-only

      - name: Run iOS Unit Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-test-only

  ui-tests:
    name: UI Tests — iOS Simulator
    runs-on: macos-15
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Run iOS UI Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-ui-test
