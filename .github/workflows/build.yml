name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; iOS build will run."
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --no-commit-id --name-only -r "$head" > changed-files.txt
          else
            git diff --name-only "$base" "$head" > changed-files.txt
          fi

          echo "Changed files:"
          cat changed-files.txt

          should_run=false
          while IFS= read -r path; do
            case "$path" in
              CatVox/*|CatVoxTests/*|CatVoxUITests/*|CatVox.xcodeproj/*|config/environments/*|scripts/*|Makefile|project.yml|.github/workflows/build.yml)
                should_run=true
                break
                ;;
            esac
          done < changed-files.txt

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" ]]; then
            echo "iOS-relevant changes detected; macOS build jobs will run."
          else
            echo "No iOS-relevant changes detected; macOS build jobs will be skipped."
          fi

  build:
    name: Build — iOS Simulator
    runs-on: macos-15          # Ships with Xcode 16.x; iOS 17+ SDK included
    needs: ios-changes
    if: needs.ios-changes.outputs.should_run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      # ── Project generation ───────────────────────────────────────────────
      # Regenerate from project.yml to catch any drift between the spec
      # and the committed .xcodeproj.
      - name: Generate Xcode project
        run: make ios-generate

      - name: Validate Firebase Environment Config
        run: |
          node --version
          make ios-validate-env-config

      # ── Build ────────────────────────────────────────────────────────────
      # Targets the generic simulator slice — no device signing required.
      - name: Build for iOS Simulator
        timeout-minutes: 15
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-build-only

      - name: Run iOS Unit Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-test-only

  ui-tests:
    name: UI Tests — iOS Simulator
    runs-on: macos-15
    needs: [ios-changes, build]
    if: needs.ios-changes.outputs.should_run == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Run iOS UI Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-ui-test
