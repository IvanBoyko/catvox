name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — iOS Simulator
    runs-on: macos-15          # Ships with Xcode 16.x; iOS 17+ SDK included

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      # ── Project generation ───────────────────────────────────────────────
      # Regenerate from project.yml to catch any drift between the spec
      # and the committed .xcodeproj.
      - name: Generate Xcode project
        run: make ios-generate

      # ── Build ────────────────────────────────────────────────────────────
      # Targets the generic simulator slice — no device signing required.
      - name: Build for iOS Simulator
        run: make ios-build-only

      - name: Run iOS Unit Tests
        run: make ios-test-only

  ui-tests:
    name: UI Tests — iOS Simulator
    runs-on: macos-15
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Run iOS UI Tests
        run: make ios-ui-test
