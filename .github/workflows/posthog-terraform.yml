name: PostHog Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - '.github/workflows/posthog-terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - '.github/workflows/posthog-terraform.yml'

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one. Separate group from the GCP Terraform workflow.
concurrency:
  group: posthog-terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange (state bucket access)
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_ENVIRONMENT: dev
  CATVOX_POSTHOG_TF_STATE_PREFIX: posthog/state

  # PostHog provider credential. Non-secret provider identifiers come from
  # config/environments/${CATVOX_ENVIRONMENT}.xcconfig via the Makefile.
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

  # The PostHog project ID, organization ID, and provider API host come from
  # config/environments/${CATVOX_ENVIRONMENT}.xcconfig so app config remains
  # the source of truth.

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF (for state
  # bucket access), runs terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read environment config
        id: env
        shell: bash
        run: |
          set -euo pipefail
          config="config/environments/${CATVOX_ENVIRONMENT}.xcconfig"

          read_value() {
            scripts/lib/read-xcconfig-value.sh "$config" "$1"
          }

          gcp_project_id="$(read_value GCP_PROJECT_ID)"
          gcp_service_account="$(read_value CATVOX_GCP_CI_SERVICE_ACCOUNT)"
          gcp_wif_provider="$(read_value CATVOX_GCP_WIF_PROVIDER)"

          if [[ -z "$gcp_project_id" ]]; then
            echo "GCP_PROJECT_ID must be set in $config" >&2
            exit 1
          fi
          if [[ -z "$gcp_service_account" ]]; then
            echo "CATVOX_GCP_CI_SERVICE_ACCOUNT must be set in $config" >&2
            exit 1
          fi
          if [[ -z "$gcp_wif_provider" ]]; then
            echo "CATVOX_GCP_WIF_PROVIDER must be set in $config" >&2
            exit 1
          fi

          {
            printf 'gcp_project_id=%s\n' "$gcp_project_id"
            printf 'gcp_service_account=%s\n' "$gcp_service_account"
            printf 'gcp_wif_provider=%s\n' "$gcp_wif_provider"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'CATVOX_ENV_CONFIG=%s\n' "$config"
            printf 'GCP_PROJECT_ID=%s\n' "$gcp_project_id"
            printf 'CATVOX_GCP_CI_SERVICE_ACCOUNT=%s\n' "$gcp_service_account"
            printf 'CATVOX_GCP_WIF_PROVIDER=%s\n' "$gcp_wif_provider"
          } >> "$GITHUB_ENV"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.env.outputs.gcp_wif_provider }}
          service_account: ${{ steps.env.outputs.gcp_service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make posthog-terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make posthog-terraform-init

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make posthog-terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          make posthog-terraform-ci-plan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps. Truncates plan output
      # if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const actor    = '${{ github.actor }}';

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## PostHog Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (outcome === 'failure') {
              core.setFailed('PostHog Terraform plan failed — see PR comment for details.');
            }

  # ── Apply ────────────────────────────────────────────────────────────────────
  # Runs only when a commit lands on main (i.e. PR is merged). Re-authenticates
  # via WIF and applies the plan with -auto-approve.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read environment config
        id: env
        shell: bash
        run: |
          set -euo pipefail
          config="config/environments/${CATVOX_ENVIRONMENT}.xcconfig"

          read_value() {
            scripts/lib/read-xcconfig-value.sh "$config" "$1"
          }

          gcp_project_id="$(read_value GCP_PROJECT_ID)"
          gcp_service_account="$(read_value CATVOX_GCP_CI_SERVICE_ACCOUNT)"
          gcp_wif_provider="$(read_value CATVOX_GCP_WIF_PROVIDER)"

          if [[ -z "$gcp_project_id" ]]; then
            echo "GCP_PROJECT_ID must be set in $config" >&2
            exit 1
          fi
          if [[ -z "$gcp_service_account" ]]; then
            echo "CATVOX_GCP_CI_SERVICE_ACCOUNT must be set in $config" >&2
            exit 1
          fi
          if [[ -z "$gcp_wif_provider" ]]; then
            echo "CATVOX_GCP_WIF_PROVIDER must be set in $config" >&2
            exit 1
          fi

          {
            printf 'gcp_project_id=%s\n' "$gcp_project_id"
            printf 'gcp_service_account=%s\n' "$gcp_service_account"
            printf 'gcp_wif_provider=%s\n' "$gcp_wif_provider"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'CATVOX_ENV_CONFIG=%s\n' "$config"
            printf 'GCP_PROJECT_ID=%s\n' "$gcp_project_id"
            printf 'CATVOX_GCP_CI_SERVICE_ACCOUNT=%s\n' "$gcp_service_account"
            printf 'CATVOX_GCP_WIF_PROVIDER=%s\n' "$gcp_wif_provider"
          } >> "$GITHUB_ENV"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.env.outputs.gcp_wif_provider }}
          service_account: ${{ steps.env.outputs.gcp_service_account }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make posthog-terraform-init

      - name: Terraform Apply
        run: make posthog-terraform-ci-apply
