name: PostHog Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - '.github/workflows/posthog-terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - '.github/workflows/posthog-terraform.yml'

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one. Separate group from the GCP Terraform workflow.
concurrency:
  group: posthog-terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange (state bucket access)
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_TERRAFORM_ENV: dev
  CATVOX_POSTHOG_TF_STATE_PREFIX: posthog/state
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # State bucket for the PostHog root reuses the per-environment GCS bucket.
  CATVOX_POSTHOG_TF_STATE_BUCKET: ${{ format('catvox-tf-state-{0}', secrets.GCP_PROJECT_ID) }}

  # PostHog provider configuration. The provider reads these env vars natively.
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  POSTHOG_ORGANIZATION_ID: ${{ secrets.POSTHOG_ORGANIZATION_ID }}

  # The PostHog project ID and provider API host come from
  # config/environments/dev.xcconfig via the Makefile so app config remains the
  # source of truth.

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF (for state
  # bucket access), runs terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make posthog-terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make posthog-terraform-init

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make posthog-terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          make posthog-terraform-ci-plan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps. Truncates plan output
      # if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const actor    = '${{ github.actor }}';

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## PostHog Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (outcome === 'failure') {
              core.setFailed('PostHog Terraform plan failed — see PR comment for details.');
            }

  # ── Apply ────────────────────────────────────────────────────────────────────
  # Runs only when a commit lands on main (i.e. PR is merged). Re-authenticates
  # via WIF and applies the plan with -auto-approve.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make posthog-terraform-init

      - name: Terraform Apply
        run: make posthog-terraform-ci-apply
