name: PostHog Terraform

on:
  # Manual trigger = promote PostHog Terraform to prod. There is no environment
  # chooser: dev is the automatic path (push to main), prod is this manual step.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/actions/terraform-ci-plan/**'
      - '.github/workflows/posthog-terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/posthog/**'
      - 'Makefile'
      - 'config/environments/**'
      - 'scripts/lib/read-xcconfig-value.sh'
      - 'scripts/lib/emit-xcconfig-env.sh'
      - 'scripts/lib/xcconfig-parse.awk'
      - 'scripts/lib/xcconfig-validate.sh'
      - '.github/actions/read-environment-config/**'
      - '.github/actions/gcp-auth/**'
      - '.github/actions/terraform-ci-plan/**'
      - '.github/workflows/posthog-terraform.yml'

# Cancel any in-progress run for the same branch + event so the manual prod
# promote never cancels the automatic dev apply on main.
concurrency:
  group: posthog-terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write       # Required for Workload Identity Federation token exchange (state bucket access)
  pull-requests: write  # Required to post plan output as a PR comment

env:
  CATVOX_POSTHOG_TF_STATE_PREFIX: posthog/state

  # The PostHog project ID, organization ID, and provider API host come from
  # config/environments/${CATVOX_ENVIRONMENT}.xcconfig so app config remains
  # the source of truth.

jobs:
  # ── Plan ────────────────────────────────────────────────────────────────────
  # Runs on every PR targeting main. Authenticates to GCP via WIF (for state
  # bucket access), runs terraform plan, and posts the result as a PR comment.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'
    env:
      CATVOX_ENVIRONMENT: dev
      # PostHog provider credential. Non-secret provider identifiers come from
      # config/environments/${CATVOX_ENVIRONMENT}.xcconfig via the Makefile.
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Check formatting before doing anything else — fast fail.
      - name: Terraform Format Check
        id: fmt
        run: make posthog-terraform-fmt-check
        continue-on-error: true  # Report in PR comment rather than failing the step

      - name: Terraform Init
        id: init
        run: make posthog-terraform-init

      - name: Terraform Validate
        id: validate
        run: |
          set +e
          make posthog-terraform-validate 2>&1 | tee validate.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo 'stdout<<EOF'
            cat validate.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/terraform-ci-plan
        with:
          make-target: posthog-terraform-ci-plan
        continue-on-error: true  # Failure is surfaced in the PR comment below

      # Post a structured comment summarising all steps — but only when there is
      # something to report. A clean run (plan exit code 0 = no changes, all
      # other checks green) skips the comment so it never emails reviewers. Plan
      # output is truncated if it exceeds GitHub's 65 535-character comment limit.
      - name: Post plan to PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = ${{ toJSON(steps.validate.outputs.stdout) }};
            const plan     = ${{ toJSON(steps.plan.outputs.stdout) }};
            const outcome  = '${{ steps.plan.outcome }}';
            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const actor    = '${{ github.actor }}';

            // Skip the comment entirely on a clean no-change run (plan exit
            // code 0, fmt green). Posting nothing means GitHub sends no email —
            // only real diffs (exit 2) and failures get a comment.
            if (exitcode === '0' && fmt !== 'failure') {
              core.info('PostHog Terraform plan: no changes and all checks passed — skipping PR comment.');
              return;
            }

            const MAX = 60000;
            const planBody = plan.length > MAX
              ? plan.slice(0, MAX) + '\n\n⚠️ Output truncated — see full logs in Actions.'
              : plan;

            const body = [
              '## PostHog Terraform Plan — `' + outcome + '`',
              '',
              '| Step | Result |',
              '|---|---|',
              '| Format  | `' + fmt + '` |',
              '| Init    | `' + init + '` |',
              '',
              '**Validate**',
              '```',
              validate,
              '```',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planBody,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by ${actor} · \`${context.eventName}\`*`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

            if (outcome === 'failure') {
              core.setFailed('PostHog Terraform plan failed — see PR comment for details.');
            }

  # ── Apply: dev (automatic) ───────────────────────────────────────────────────
  # Runs when a commit lands on main (i.e. PR merged). Applies to dev.
  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      CATVOX_ENVIRONMENT: dev
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make posthog-terraform-init

      - name: Terraform Apply
        run: make posthog-terraform-ci-apply

  # ── Apply: prod (manual promotion) ───────────────────────────────────────────
  # Runs only on manual workflow_dispatch from main. The protected `prod`
  # GitHub Environment gates the run and its WIF trust requires refs/heads/main.
  apply-prod:
    name: Apply (prod)
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      CATVOX_ENVIRONMENT: prod
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: ./.github/actions/gcp-auth
        with:
          environment: ${{ env.CATVOX_ENVIRONMENT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: make posthog-terraform-init

      - name: Terraform Apply
        run: make posthog-terraform-ci-apply
