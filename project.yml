name: CatVox
options:
  bundleIdPrefix: com.kathelix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.4"

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.57.2
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.13.0

targets:
  CatVox:
    type: application
    platform: iOS
    sources:
      - CatVox
    dependencies:
      - package: PostHog
        product: PostHog
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
    settings:
      base:
        CATVOX_PRODUCT_BUNDLE_IDENTIFIER: com.kathelix.catvox
        PRODUCT_BUNDLE_IDENTIFIER: $(CATVOX_PRODUCT_BUNDLE_IDENTIFIER)
        DEVELOPMENT_TEAM: QYT76L5836
        CODE_SIGN_ENTITLEMENTS: CatVox/CatVox.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"CatVox/Preview Content"'
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        CATVOX_ENVIRONMENT: dev
        CATVOX_SIGNED_UPLOAD_URL_ENDPOINT: "https://getsigneduploadurl-pdkw5uifga-uc.a.run.app"
        CATVOX_ANALYSE_VIDEO_ENDPOINT: "https://analysevideo-pdkw5uifga-uc.a.run.app"
        CATVOX_POSTHOG_PROJECT_TOKEN: "phc_ktoFY7ywiGeSCdyLT7msVfWtankAWx8QLLrLerBzmMr8"
        CATVOX_POSTHOG_HOST: "https://us.i.posthog.com"
    info:
      path: CatVox/Info.plist
      properties:
        CFBundleDisplayName: CatVox
        CatVoxEnvironment: $(CATVOX_ENVIRONMENT)
        CatVoxSignedUploadURLEndpoint: $(CATVOX_SIGNED_UPLOAD_URL_ENDPOINT)
        CatVoxAnalyseVideoEndpoint: $(CATVOX_ANALYSE_VIDEO_ENDPOINT)
        CatVoxPostHogProjectToken: $(CATVOX_POSTHOG_PROJECT_TOKEN)
        CatVoxPostHogHost: $(CATVOX_POSTHOG_HOST)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "CatVox records 10-second clips to analyse your cat's behaviour."
        NSMicrophoneUsageDescription: "CatVox captures audio to analyse your cat's vocalisations."
        NSPhotoLibraryAddUsageDescription: "CatVox saves rendered share videos to your Photos library when you ask it to."

  CatVoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CatVoxTests
    dependencies:
      - target: CatVox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kathelix.catvox.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  CatVoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CatVoxUITests
    dependencies:
      - target: CatVox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kathelix.catvox.uitests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CatVox

schemes:
  CatVox:
    build:
      targets:
        CatVox: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatVoxTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CatVoxUITests:
    build:
      targets:
        CatVox: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatVoxUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
